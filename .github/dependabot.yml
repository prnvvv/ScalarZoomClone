version: 2

updates:
  # CI action versions (actions/checkout, actions/setup-python, ...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python packages. Tracked against the CI install list until
  # backend/requirements.txt is populated (owned by Backend Developer 1).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # FastAPI/Pydantic/SQLAlchemy majors carry breaking contract changes
      # that must be reviewed against AGENTS.md, not auto-merged.
      - dependency-name: "fastapi"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "pydantic"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "sqlalchemy"
        update-types:
          - "version-update:semver-major"

  # Frontend packages (frontend/package-lock.json). Minor and patch updates
  # are grouped; framework majors are ignored because they carry breaking
  # changes that must be reviewed against frontend/AGENTS.md first.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      frontend-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-config-next"
        update-types:
          - "version-update:semver-major"