name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Realtime backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./ci_test.db
      FRONTEND_URL: http://localhost:3000
      STUN_SERVER: stun:stun.l.google.com:19302

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.117,<1.0" "uvicorn[standard]>=0.37" \
                      "sqlalchemy>=2.0,<3.0" "pydantic>=2.11,<3.0" \
                      "pytest>=8.4" "httpx>=0.28"

      - name: Byte-compile all sources
        run: python -m compileall -q app tests

      - name: Run test suite
        run: python -m pytest tests/test_websocket.py -v --tb=short -rs